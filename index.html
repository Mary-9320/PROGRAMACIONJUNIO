<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Editable - Programación de Trabajo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: { 500: '#00AEEF', 600: '#008CBE', 100: '#E5F7FD' },
                        brandOrange: { 500: '#F47920', 600: '#D96515', 100: '#FEF1E8' }
                    }
                }
            }
        }
    </script>
    <style>
        .editable { transition: all 0.2s; border-radius: 0.25rem; outline: none; cursor: text; }
        .editable:hover { background-color: rgba(244, 121, 32, 0.1); box-shadow: 0 0 0 1px #F47920; }
        .editable:focus { background-color: white; box-shadow: 0 0 0 2px #00AEEF; color: #111827 !important; }
        .editable[contenteditable="false"] { cursor: not-allowed; background-color: transparent !important; box-shadow: none !important; }
        input[type="date"]:disabled { cursor: not-allowed; opacity: 0.6; }
        td.editable { padding-left: 0.5rem; padding-right: 0.5rem; }
        .cal-area-lazarocardenas { border-left: 4px solid #00AEEF; background-color: #E5F7FD; }
        .cal-area-brigada { border-left: 4px solid #F47920; background-color: #FEF1E8; }
        .cal-area-salinas { border-left: 4px solid #10b981; background-color: #ecfdf5; }
        .cal-area-foraneas { border-left: 4px solid #ef4444; background-color: #fef2f2; }
        .cal-area-entomologia { border-left: 4px solid #8b5cf6; background-color: #f5f3ff; }
        .cal-area-nebulizacion { border-left: 4px solid #06b6d4; background-color: #ecfeff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans relative pb-10">

    <div class="bg-gray-800 text-white py-2 px-4 md:px-8 flex justify-between items-center z-50 relative shadow-md" data-html2canvas-ignore="true">
        <div class="text-sm md:text-base font-bold tracking-wider flex items-center">
            <i class="fas fa-shield-alt text-brandBlue-500 mr-2 text-lg"></i> 
            <span class="hidden sm:inline">SISTEMA DE PROGRAMACIÓN </span>JS6
        </div>
        <div id="auth-locked" class="flex items-center transition-all">
            <span class="text-xs text-gray-400 mr-3 hidden md:inline"><i class="fas fa-lock mr-1"></i> Modo Lectura</span>
            <button onclick="requerirAcceso(() => { window.mostrarModal('Sistema Desbloqueado', 'Bienvenido, ahora puedes crear y editar programaciones.', 'success') })" class="bg-brandBlue-600 hover:bg-brandBlue-500 px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold shadow transition flex items-center">
                <i class="fas fa-unlock-alt mr-2"></i> Desbloquear Sistema
            </button>
        </div>
        <div id="auth-unlocked" class="hidden flex items-center transition-all">
            <span class="text-xs md:text-sm text-green-400 mr-4 font-medium"><i class="fas fa-user-check mr-1"></i> <span id="auth-role-name" class="font-bold text-white"></span></span>
            <button onclick="bloquearSistema()" class="bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded-lg text-xs md:text-sm font-bold shadow transition flex items-center">
                <i class="fas fa-lock mr-2"></i> Bloquear
            </button>
        </div>
    </div>

    <div id="banner-edicion" class="hidden fixed bottom-0 left-0 w-full bg-brandOrange-600 text-white text-center py-3 px-4 z-[100] shadow-[0_-4px_6px_rgba(0,0,0,0.1)] flex flex-col md:flex-row justify-center md:justify-between items-center gap-3 transition-all" data-html2canvas-ignore="true">
        <div class="text-sm md:text-base"><i class="fas fa-user-edit mr-2"></i> <strong>MODO EDICIÓN</strong></div>
        <button onclick="cancelarEdicion()" class="bg-gray-900 hover:bg-black text-white px-4 py-1.5 rounded-lg text-sm font-bold shadow"><i class="fas fa-times mr-2"></i> Cancelar</button>
    </div>

    <div id="custom-modal" class="hidden fixed inset-0 bg-black/50 z-[80] flex items-center justify-center backdrop-blur-sm p-4" data-html2canvas-ignore="true">
        <div class="bg-white p-6 rounded-xl max-w-sm w-full shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-2"></h3>
            <p id="modal-msg" class="text-gray-600 mb-6"></p>
            <div class="flex justify-end gap-3" id="modal-buttons"></div>
        </div>
    </div>

    <div id="modal-clave" class="hidden fixed inset-0 bg-black/60 z-[90] flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-xs w-full">
            <h3 class="text-xl font-bold text-center mb-4">Autorización</h3>
            <input type="password" id="input-clave" onkeydown="if(event.key === 'Enter') verificarClave()" class="w-full border-2 p-3 rounded-lg mb-6 text-center text-2xl" placeholder="•••">
            <button onclick="verificarClave()" class="w-full py-2 bg-brandBlue-600 text-white font-bold rounded-lg">Acceder</button>
        </div>
    </div>

    <div class="p-2 md:p-8 pt-4">
        <div class="max-w-7xl mx-auto mb-4 flex flex-wrap gap-1" data-html2canvas-ignore="true">
            <button onclick="cambiarPestana('lazarocardenas')" class="tab-btn px-3 py-2 bg-brandBlue-600 text-white font-bold rounded-t-lg">C. LARVARIO 1</button>
            <button onclick="cambiarPestana('brigada')" class="tab-btn px-3 py-2 bg-gray-300 text-gray-700 font-bold rounded-t-lg">BRIGADA JS6</button>
            <button onclick="cambiarPestana('salinas')" class="tab-btn px-3 py-2 bg-gray-300 text-gray-700 font-bold rounded-t-lg">CSU C. SALINAS</button>
            <button onclick="cambiarPestana('foraneas')" class="tab-btn px-3 py-2 bg-gray-300 text-gray-700 font-bold rounded-t-lg">FORÁNEAS</button>
            <button onclick="cambiarPestana('entomologia')" class="tab-btn px-3 py-2 bg-gray-300 text-gray-700 font-bold rounded-t-lg">ENTOMOLOGÍA</button>
            <button onclick="cambiarPestana('nebulizacion')" class="tab-btn px-3 py-2 bg-gray-300 text-gray-700 font-bold rounded-t-lg">NEBULIZACIÓN</button>
            <div class="flex ml-auto gap-1">
                <button onclick="cambiarPestana('resumen')" class="tab-btn px-3 py-2 bg-indigo-600 text-white font-bold rounded-t-lg">PLAN. ENTOMO</button>
                <button onclick="cambiarPestana('calendario')" class="tab-btn px-3 py-2 bg-purple-600 text-white font-bold rounded-t-lg">CALENDARIO</button>
                <button onclick="cambiarPestana('historial')" class="tab-btn px-3 py-2 bg-gray-800 text-white font-bold rounded-t-lg">NUBE</button>
            </div>
        </div>

        <div id="contenedores-areas"></div>
        <div id="contenedor-resumen" class="tab-content hidden">...</div>
        <div id="contenedor-historial" class="tab-content hidden">...</div>
        
        <div id="contenedor-calendario" class="tab-content hidden">
            <div class="max-w-7xl mx-auto bg-gray-100 p-4 rounded-xl">
                <header class="bg-white rounded-t-xl shadow-sm border-b-4 border-purple-500 p-6 mb-6">
                    <h1 class="text-2xl font-bold text-purple-700"><i class="fas fa-calendar-alt mr-2"></i> Resumen General</h1>
                </header>
                <div id="grid-calendario-general"></div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbzxIbQnM8EE3619wlerCfSwlCUVFlTXH5J8gnV4EufB4MsdWrtjNPkNBKPRa77KbxhMZw/exec"; 
        window.historialGuardado = [];

        // --- CALENDARIO DINÁMICO ---
        window.actualizarVistaCalendario = () => {
            const gridCal = document.getElementById('grid-calendario-general');
            const calendarMap = {}; 

            window.historialGuardado.forEach(reg => {
                if (reg.diasData && Array.isArray(reg.diasData)) {
                    reg.diasData.forEach(dia => {
                        const partesFecha = dia.fecha.match(/(\d{2}) \/ (\d{2}) \/ (\d{4})/);
                        if (!partesFecha) return;
                        
                        const yyyy = partesFecha[3];
                        const mm = partesFecha[2];
                        const dd = partesFecha[1];
                        const isoDate = `${yyyy}-${mm}-${dd}`;

                        if (!calendarMap[isoDate]) calendarMap[isoDate] = [];
                        
                        calendarMap[isoDate].push({
                            area: reg.area,
                            sector: reg.sector,
                            colonia: reg.colonia,
                            tareas: dia.tareas
                        });
                    });
                }
            });

            const fechasOrdenadas = Object.keys(calendarMap).sort();

            if (fechasOrdenadas.length === 0) {
                gridCal.innerHTML = '<div class="text-center py-10 text-gray-500 italic">No hay datos programados en el historial.</div>';
                return;
            }

            let html = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">';
            
            fechasOrdenadas.forEach(fecha => {
                const fechaObj = new Date(fecha + 'T00:00:00');
                const nombreDia = fechaObj.toLocaleDateString('es-MX', { weekday: 'long' });
                
                html += `
                <div class="bg-white rounded-lg shadow border border-gray-200 p-4 min-h-[150px]">
                    <h3 class="font-bold text-gray-700 border-b pb-2 mb-3 capitalize">
                        ${nombreDia} <span class="block text-sm text-blue-600 font-normal">${fecha.split('-').reverse().join('/')}</span>
                    </h3>
                    <div class="space-y-3">`;

                calendarMap[fecha].forEach(item => {
                    const areaInfo = areasInfo.find(a => a.nombre === item.area) || { claseCSS: 'border-l-4 border-gray-400 bg-gray-50' };
                    
                    html += `
                    <div class="p-2 rounded border shadow-sm ${areaInfo.claseCSS} text-[11px]">
                        <div class="font-bold uppercase mb-1">${item.area}</div>
                        <div class="italic mb-1 border-b border-black/10">Sec: ${item.sector} | Col: ${item.colonia}</div>
                        <ul class="list-disc pl-3">`;
                        
                    item.tareas.forEach(t => {
                        html += `<li><strong>${t.aplicativo}:</strong> ${t.manzanas} <span class="opacity-70">(${t.total})</span></li>`;
                    });
                    
                    html += `</ul></div>`;
                });

                html += `</div></div>`;
            });

            html += '</div>';
            gridCal.innerHTML = html;
        };

        // --- RESTO DE TU LÓGICA EXISTENTE ---
        // (Asegúrate de mantener el resto de tus funciones aquí abajo, como `cambiarPestana`, `cargarHistorial`, etc.)
        // La estructura base que proporcionaste debe permanecer igual.
        
        window.onload = () => {
            // ... (Tu código de inicialización original)
            inicializarContenedores();
            bloquearSistema(); 
            window.cargarHistorial(); 
        };
    </script>
</body>
</html>
